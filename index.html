<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bayu Jaya</title>
  <!-- Google Font: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: #9ba4aa;
      background-image: radial-gradient(#d1d5db 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .card-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 28px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .header-section { text-align: center; margin-bottom: 28px; position: relative; }
    
    .logo-box {
      width: 56px; height: 56px; background-color: #ecfdf5; border: 1px solid #d1fae5;
      border-radius: 18px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 24px; color: #047857; margin-bottom: 14px;
    }

    .header-section h1 { font-size: 22px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; margin-bottom: 4px; }
    .header-section p { font-size: 13px; color: #64748b; font-weight: 500; margin-bottom: 14px; }
    
    .btn-logout {
      background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 6px 14px;
      border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; transition: 0.2s;
    }
    .btn-logout:hover { background: #fee2e2; }

    /* Layout Grid 2 Kolom */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 22px 12px;
      border-radius: 20px;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      user-select: none;
    }

    .menu-item:hover {
      background-color: #ffffff;
      border-color: #cbd5e1;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
      transform: translateY(-3px);
    }

    .icon-wrapper {
      width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center;
      justify-content: center; font-size: 22px; margin-bottom: 12px; flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .menu-item:hover .icon-wrapper {
      transform: scale(1.08);
    }

    /* Variasi Warna Icon */
    .icon-blue   { background-color: #eff6ff; color: #2563eb; border: 1px solid #dbeafe; }
    .icon-green  { background-color: #ecfdf5; color: #059669; border: 1px solid #d1fae5; }
    .icon-purple { background-color: #f3e8ff; color: #7c3aed; border: 1px solid #e9d5ff; }
    .icon-amber  { background-color: #fffbeb; color: #d97706; border: 1px solid #fef3c7; }
    .icon-indigo { background-color: #e0e7ff; color: #4338ca; border: 1px solid #c7d2fe; }
    .icon-rose   { background-color: #ffe4e6; color: #e11d48; border: 1px solid #fecdd3; }

    .title {
      font-size: 13px;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: 0.2px;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <!-- === LAYAR LOGIN === -->
  <div id="loginScreen" style="position: fixed; inset: 0; background: #9ba4aa; background-image: radial-gradient(#d1d5db 1.5px, transparent 1.5px); background-size: 24px 24px; z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: white; padding: 40px 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%; max-width: 360px; text-align: center; border: 1px solid rgba(226, 232, 240, 0.6);">
      <div style="width: 60px; height: 60px; border-radius: 18px; background: #ecfdf5; color: #047857; display: grid; place-items: center; font-size: 28px; margin: 0 auto 20px; border: 1px solid #d1fae5;">🔐</div>
      <h2 style="font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 6px; letter-spacing: -0.5px;">Portal Karyawan</h2>
      <p style="color: #64748b; font-size: 14px; font-weight: 500; margin-bottom: 28px;">Silakan login untuk akses menu.</p>
      
      <input type="text" id="loginUser" placeholder="Username" oninput="this.value = this.value.toUpperCase()" style="width: 100%; padding: 14px 16px; margin-bottom: 16px; border: 2px solid #cbd5e1; border-radius: 12px; font-size: 15px; outline: none; background: #f8fafc; font-weight: 700; text-align: center; letter-spacing: 1px; color:#0f172a;">
      <input type="password" id="loginPass" placeholder="Password" style="width: 100%; padding: 14px 16px; margin-bottom: 24px; border: 2px solid #cbd5e1; border-radius: 12px; font-size: 15px; outline: none; background: #f8fafc; font-weight: 700; text-align: center; letter-spacing: 2px; color:#0f172a;">
      
      <button onclick="checkLogin()" style="width: 100%; padding: 16px; background: #2563eb; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s;">Masuk Sistem</button>
      
      <p id="loginError" style="color: #dc2626; font-size: 13px; font-weight: 700; margin-top: 16px; display: none; background: #fef2f2; padding: 10px; border-radius: 8px; border: 1px solid #fecaca;">⚠️ Kredensial tidak valid!</p>
    </div>
  </div>

  <!-- === MENU UTAMA (1 BARIS 2 LINK) === -->
  <div class="card-container" id="mainApp" style="display: none;">
    <div class="header-section">
      <div class="logo-box"><i class="fa-solid fa-leaf"></i></div>
      <h1>MENU UTAMA</h1>
      <p>Bayu Jaya Operations</p>
      <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-power-off"></i> Keluar</button>
    </div>

    <div class="menu-grid">
      
      <!-- 1. PEMBUKUAN -->
      <a onclick="openApp('https://script.google.com/macros/s/AKfycbzvjcxcuU8pACqCEniX1YJopr1RqKcygD_sVnQPnkU43J__F2lUhB3l_xM487IqOutOHg/exec')" class="menu-item">
        <div class="icon-wrapper icon-blue"><i class="fa-solid fa-book"></i></div>
        <span class="title">PEMBUKUAN</span>
      </a>

      <!-- 2. INVOICE TONASE -->
      <a onclick="openApp('https://script.google.com/macros/s/AKfycbzkoho6pD4B9dotnnjGYaichhkEdicdhzyNMc2QsMYXTL4FiAFKfI_vUci55WaQOfMQ/exec')" class="menu-item">
        <div class="icon-wrapper icon-rose"><i class="fa-solid fa-file-invoice-dollar"></i></div>
        <span class="title">INVOICE TONASE</span>
      </a>

      <!-- 3. KUITANSI -->
      <a onclick="openApp('aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J6VFdMOHNibVlFem9oREY5bEpyZTBwQlJxazdqdHhTQWxscUJCS0dXM0NtTVQwc0U4dk1BWnZpZmhBNHI2MVlmZHMvZXhlYw==')" class="menu-item">
        <div class="icon-wrapper icon-indigo"><i class="fa-solid fa-receipt"></i></div>
        <span class="title">KUITANSI</span>
      </a>

      <!-- 4. REKAP WSM -->
      <a onclick="openApp('aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J6d1hIVG5UcFE1YjJUV2s1dDNMbDQ2emN6M0JGd1pHdXVzOWc4NnUtUEdIZGoweTA3Z1lmSFlpYV9LZUtkZ3dPejEvZXhlYw==')" class="menu-item">
        <div class="icon-wrapper icon-purple"><i class="fa-solid fa-chart-line"></i></div>
        <span class="title">REKAP WSM</span>
      </a>

      <!-- 5. DAFTAR HARGA -->
      <a onclick="openApp('aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J3N2FoSkNQak5xZnZVRGFqeU93ZGRoQkhBSGNvbXhOblZYb0xSWUk3dTl0SWJWMWRtb25uQ3dsdm81a2RnZ0xaRHQvZXhlYz9wYWdlPWFkbWluJmtleT1iYXl1amF5YTEyMzIwMDY=')" class="menu-item">
        <div class="icon-wrapper icon-green"><i class="fa-solid fa-tags"></i></div>
        <span class="title">DAFTAR HARGA</span>
      </a>

      <!-- 6. DAFTAR REKENING -->
      <a onclick="openApp('https://script.google.com/macros/s/AKfycbx7cajkZVD2DGBvb7GBOMITQTydboHxHVQoO1TC61MOhX8G-9OKhF6O-8edFERJjB-QVg/exec')" class="menu-item">
        <div class="icon-wrapper icon-amber"><i class="fa-solid fa-building-columns"></i></div>
        <span class="title">DAFTAR REKENING</span>
      </a>

    </div>
  </div>

  <script>
    // URL API Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbxYBOinZ0Yhvt8K5zTXPI2RayxdhgpaAVRw63LH0KlkUTjyQTIEwTJI7WemOAZzfsI/exec";

    // 1. Cek Memori Browser (Otomatis masuk jika sudah pernah login)
    window.onload = function() {
      if (localStorage.getItem("bayuJayaAccess") === "granted") {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("mainApp").style.display = "block";
      }
    };

    // 2. Logika Verifikasi Sandi via Server API
    function checkLogin() {
      const user = document.getElementById("loginUser").value;
      const pass = document.getElementById("loginPass").value;
      const btn = event.target;
      const err = document.getElementById("loginError");

      btn.textContent = "Mengecek Server...";
      btn.style.background = "#475569"; 
      btn.disabled = true;

      fetch(`${API_URL}?user=${user}&pass=${pass}`)
        .then(response => response.json())
        .then(data => {
          if (data.status === "sukses") {
            btn.textContent = "Berhasil Masuk ✅";
            btn.style.background = "#059669";
            
            localStorage.setItem("bayuJayaAccess", "granted");
            
            setTimeout(() => {
              document.getElementById("loginScreen").style.display = "none";
              document.getElementById("mainApp").style.display = "block";
            }, 600);
          } else {
            throw new Error("Kredensial Salah");
          }
        })
        .catch(error => {
          btn.textContent = "Masuk Sistem";
          btn.style.background = "#2563eb";
          btn.disabled = false;
          
          err.style.display = "block";
          setTimeout(() => { err.style.display = "none"; }, 3000);
        });
    }

    // 3. Fungsi Buka App (Mendukung URL Biasa & Base64)
    function openApp(input) {
      if (input.startsWith('http://') || input.startsWith('https://')) {
        window.open(input, '_blank');
      } else {
        try {
          const realUrl = atob(input); 
          window.open(realUrl, '_blank');
        } catch(e) {
          window.open(input, '_blank');
        }
      }
    }

    // 4. Fungsi Keluar
    function logout() {
      localStorage.removeItem("bayuJayaAccess");
      location.reload(); 
    }
  </script>
</body>
</html>
